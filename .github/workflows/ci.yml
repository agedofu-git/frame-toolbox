# 公開リポジトリでサービスとMock UIを検証するCI。
# 実機やroot設定を必要とせずLinuxとWindowsでテストする。
name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # 使い捨てのCI runnerだけにQt描画の依存を追加する。実機導入ではOSを変更しない。
      - name: Install Qt rendering libraries on CI runner
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 fonts-dejavu-core
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
      - run: python scripts/smoke_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: mock-ui-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/ui/*.png
